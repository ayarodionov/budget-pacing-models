# Stream pattern: periodic. Busy evenings, quiet mornings, quieter weekends.
# The center knows the profile (profile_belief defaults to "true").
#     uv run python -m pacing.scenario_file scenarios/streams/periodic.toml

[campaign]
budget = 168_000
length_days = 2
eps = 0.01

[spend]
charged_share = 0.1
delay_seconds = 30

[infrastructure]
control_period_seconds = 60

[center]
prior_mean = 100

[traffic]
request_rate = 1000
profile = "periodic"
daily_amplitude = 0.6
peak_hour = 20
weekend = 0.7
